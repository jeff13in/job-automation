name: MCTI Partner Job Scan

# Visits the job board of every University of Guelph MCTI industry partner,
# filters to relevant roles, and reports what is new since the last run.
#
# Every run:
#   1. auto-discovers boards for any partner still marked `platform: auto`
#   2. scans every partner's board
#   3. commits reports/ + state/seen.json back to the repo
#   4. writes the report to the run summary
#   5. opens a GitHub issue listing the new roles (so you get notified)

on:
  schedule:
    # 12:40 UTC = 7:40 Toronto (EST), Mon-Fri. GitHub cron is always UTC.
    - cron: '40 12 * * 1-5'
  # On PRs that touch the scanner: a dry run on GitHub's runners, so changes
  # are tested against the live boards before merge. Never commits or opens issues.
  pull_request:
    paths:
      - 'mcti_scan/**'
      - '.github/workflows/mcti-partner-scan.yml'
  workflow_dispatch:
    inputs:
      rediscover:
        description: 'Re-probe every partner board (use when a partner starts erroring)'
        type: boolean
        default: false
      company:
        description: 'Only scan partners whose name contains this (blank = all)'
        type: string
        default: ''
      min_score:
        description: 'Override the shortlist threshold (blank = partners.yml value)'
        type: string
        default: ''
      dry_run:
        description: "Don't update seen-state or commit anything"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mcti-partner-scan-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mcti_scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mcti_scan/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Discover partner boards
        id: discover
        env:
          REDISCOVER: ${{ inputs.rediscover }}
        run: |
          PENDING=$(python -c "import yaml; d=yaml.safe_load(open('partners.yml')); print(sum(p.get('platform','auto')=='auto' for p in d['partners']))")
          echo "partners still on platform=auto: $PENDING"
          if [ "$REDISCOVER" = "true" ]; then
            python -m mcti_scan.cli -v discover --write --all
          elif [ "$PENDING" -gt 0 ]; then
            python -m mcti_scan.cli -v discover --write
          else
            echo "all boards already resolved — skipping discovery"
          fi

      - name: Scan all partner job boards
        id: scan
        env:
          COMPANY: ${{ inputs.company }}
          MIN_SCORE: ${{ inputs.min_score }}
          DRY_RUN: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
        run: |
          ARGS=()
          [ -n "$COMPANY" ]         && ARGS+=(--company "$COMPANY")
          [ -n "$MIN_SCORE" ]       && ARGS+=(--min-score "$MIN_SCORE")
          [ "$DRY_RUN" = "true" ]   && ARGS+=(--dry)
          python -m mcti_scan.cli -v scan "${ARGS[@]}" > scan.log
          NEW=$(python -c "import json; print(len(json.load(open('reports/new_jobs.json'))))")
          echo "new_count=$NEW" >> "$GITHUB_OUTPUT"
          echo "found $NEW new role(s)"

      - name: Write run summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scan did not produce a report — see the logs above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit reports and seen-state
        if: ${{ inputs.dry_run != true && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add partners.yml state/seen.json reports/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "🎓 MCTI scan: ${{ steps.scan.outputs.new_count }} new partner role(s)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" && exit 1

      - name: Open an issue for new roles
        if: ${{ steps.scan.outputs.new_count != '0' && inputs.dry_run != true && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "**${{ steps.scan.outputs.new_count }} new role(s)** at MCTI partner companies."
            echo
            echo "| Role | Company | Location | Score |"
            echo "|---|---|---|---|"
            python -c "
          import json
          for j in sorted(json.load(open('reports/new_jobs.json')), key=lambda x: -x['score']):
              flag = ' 🎓' if j['is_student_role'] else ''
              print(f\"| [{j['title']}]({j['url']}) | {j['company']} | {j['location'] or '—'} | {j['score']}{flag} |\")
          "
            echo
            echo "Full report: [\`mcti_scan/reports/latest.md\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/mcti_scan/reports/latest.md) · [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > issue.md
          gh issue create \
            --title "🎓 ${{ steps.scan.outputs.new_count }} new MCTI partner role(s) — $(date -u +%F)" \
            --body-file issue.md
