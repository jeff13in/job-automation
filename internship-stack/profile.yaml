# Fixed answers the applier types into forms. Everything here is YOUR statement;
# the agent copies it, it never invents it.
#
# `answers` is how you unblock things over time: when a row is blocked on a
# question, add a pattern + answer here and requeue the row
# (python -m stack.applier requeue <id>). Patterns are case-insensitive regexes
# matched against the question label. First match wins, and a match here beats
# the "never answer" list, because it's you answering.

fields:
